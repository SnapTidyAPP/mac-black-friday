name: Rebuild list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deals/**', 'categories.json', 'scripts/**', 'README.md']
permissions:
  contents: write
# One rebuild at a time: merges that land close together queue up instead of racing each other.
concurrency:
  group: rebuild-list
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Build from the newest main, not the commit that triggered the run, so a queued run includes every merge.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate && npm run build
      - name: Commit README and dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dist/deals.json
          git diff --cached --quiet || git commit -m "Rebuild list"
          git pull --rebase origin main
          git push
